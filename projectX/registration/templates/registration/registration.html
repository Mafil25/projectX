{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{%static '/registration/css/reset.css' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{%static '/registration/css/reg_style.css' %}">
        <title>Registration</title>
    </head>
    <body>
        <div class="logo">
            <div class="title">
                <img src="{%static 'registration/img/X-big.png' %}" alt="">
                <p>
                    Project
                    <span>X</span>
                </p>
            </div>
            <div class="text">Lorem Ipsum has been the industry's</div>
        </div>
        <main>
            <div class="title">Регистрация</div>
            <div class="line"></div>
            <form action="{% url 'reg' %}" method="post">
                {% csrf_token %}
                <div class="info info-1">
                    <div class="input-name">
                        <p>Имя пользователя</p>
                        <input type="text" name="username">
                    </div>
                    <div class="input-group">
                        <p>Группа</p>
                        <input type="text" name="group">
                    </div>
                </div>
                <div class="line line-2"></div>
                <div class="info info-2">
                    <div class="input-email">
                        <p>Почта</p>
                        <input type="text" name="email">
                    </div>
                    <div class="input-password">
                        <p>Пароль</p>
                        <input type="password" name="password">
                    </div>
                </div>
                <h1>{{message}}</h1>
                <button type="submit" class="content_button">Регистрация</button>
                
            </form>
        </main>
        <footer>
            <div class="text">Lorem Ipsum has been the industry's</div>
        </footer>
    </body>
</html>
